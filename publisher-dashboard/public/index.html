<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容运营工作台</title>
  <link rel="stylesheet" href="/styles.css?v=20260830-dynamic-content-center">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span class="brand-glyph">内</span></span>
        <div class="brand-copy">
          <strong>内容运营工作台</strong>
          <span>选题 · 排版 · 发布</span>
        </div>
      </div>
      <nav class="topnav" aria-label="主导航">
        <button class="nav-btn active" data-view="dashboard" data-short="看板" title="数据看板">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 13h6v7H4z"></path><path d="M14 4h6v16h-6z"></path><path d="M4 4h6v5H4z"></path></svg></span>
          <span class="nav-label">数据看板</span>
        </button>
        <button class="nav-btn" data-view="plans" data-short="选题" title="选题计划">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3v4"></path><path d="M17 3v4"></path><path d="M4 8h16"></path><rect x="4" y="5" width="16" height="16" rx="3"></rect><path d="M8 13h3"></path><path d="M8 17h6"></path></svg></span>
          <span class="nav-label">选题计划</span>
        </button>
        <button class="nav-btn" data-view="content" data-short="内容" title="内容中心">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"></path><path d="M14 3v5h5"></path><path d="M10 13h7"></path><path d="M10 17h5"></path></svg></span>
          <span class="nav-label">内容中心</span>
        </button>
        <button class="nav-btn" data-view="publish" data-short="发布" title="发布中心">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12 20 4l-5 16-3-7z"></path><path d="m12 13 8-9"></path></svg></span>
          <span class="nav-label">发布中心</span>
        </button>
        <button class="nav-btn" data-view="platforms" data-short="登录" title="平台登录">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 11V8a4 4 0 0 1 8 0v3"></path><rect x="5" y="11" width="14" height="10" rx="3"></rect><path d="M12 15v2"></path></svg></span>
          <span class="nav-label">平台登录</span>
        </button>
        <button class="nav-btn" data-view="history" data-short="历史" title="发布历史">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.25"></path><path d="M4 5v5h5"></path><path d="M12 8v5l3 2"></path></svg></span>
          <span class="nav-label">发布历史</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="employee-picker" data-employee-picker>
          <button class="user-card employee-card" type="button" data-action="toggle-employee-menu" aria-haspopup="menu" aria-expanded="false" aria-label="选择操控员工">
            <span class="user-avatar employee-avatar" data-employee-avatar aria-hidden="true"></span>
            <div class="user-copy">
              <strong data-employee-name>内容编辑员</strong>
              <span data-employee-role>正文与配图整理</span>
            </div>
          </button>
          <div class="employee-menu" data-employee-menu role="menu" aria-label="选择操控员工"></div>
        </div>
        <button class="sidebar-toggle" type="button" data-action="toggle-sidebar" aria-label="折叠工作台" title="折叠工作台" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="chevron-icon">
            <path d="M15 18 9 12l6-6"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="main-area">
      <section id="view-dashboard" class="view active"></section>
      <section id="view-plans" class="view"></section>
      <section id="view-content" class="view"></section>
      <section id="view-publish" class="view"></section>
      <section id="view-platforms" class="view"></section>
      <section id="view-history" class="view"></section>
    </main>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <dialog id="candidate-dialog">
    <div class="dialog-head">
      <div>
        <strong>日选题候选</strong>
        <span id="candidate-date"></span>
      </div>
      <button class="icon-btn" data-action="close-dialog" title="关闭">×</button>
    </div>
    <div id="candidate-list" class="candidate-list"></div>
  </dialog>

  <dialog id="plan-dialog">
    <div class="dialog-head">
      <div>
        <strong>批量新增选题计划</strong>
        <span>选择日期范围后生成空计划行</span>
      </div>
      <button class="icon-btn" data-action="close-plan-dialog" title="关闭">×</button>
    </div>
    <div class="dialog-form">
      <label><span>开始日期</span><input id="plan-start-input" type="date"></label>
      <label><span>结束日期</span><input id="plan-end-input" type="date"></label>
      <label><span>默认状态</span>
        <select id="plan-status-input">
          <option value="待选题">待选题</option>
          <option value="选题已确认">选题已确认</option>
          <option value="正文已生成">正文已生成</option>
          <option value="已排版">已排版</option>
          <option value="草稿已保存">草稿已保存</option>
          <option value="已发布">已发布</option>
          <option value="发布失败">发布失败</option>
        </select>
      </label>
      <label class="span-2"><span>默认选题方向（可留空）</span><input id="plan-topic-input" type="text" placeholder="例如：视觉检测行业热点复盘"></label>
      <div class="dialog-actions">
        <button class="secondary" data-action="close-plan-dialog">取消</button>
        <button class="primary" data-action="create-plan-range">新增计划</button>
      </div>
    </div>
  </dialog>

  <dialog id="layout-dialog" class="layout-dialog">
    <div class="dialog-head">
      <div>
        <strong>排版预览</strong>
        <span id="layout-dialog-title"></span>
      </div>
      <button class="icon-btn" data-action="close-layout-dialog" title="关闭">×</button>
    </div>
    <div id="layout-dialog-body"></div>
  </dialog>

  <dialog id="import-dialog" class="import-dialog" aria-labelledby="import-dialog-title" aria-describedby="import-dialog-description">
    <div class="dialog-head">
      <div>
        <strong id="import-dialog-title">导入文章</strong>
        <span id="import-dialog-description">粘贴正文，或在本机读取一个文本文件</span>
      </div>
      <button class="icon-btn" type="button" data-action="cancel-import" aria-label="关闭导入文章对话框" title="关闭">×</button>
    </div>
    <div class="dialog-form import-dialog-form">
      <label class="span-2" for="import-title-input">
        <span>文章标题（可选）</span>
        <input id="import-title-input" type="text" maxlength="200" autocomplete="off" placeholder="留空时将从正文或文件名推断">
      </label>

      <div class="import-tabs span-2" role="tablist" aria-label="导入方式">
        <button id="import-paste-tab" class="import-tab active" type="button" role="tab" tabindex="0" data-action="select-import-tab" data-import-tab="paste" aria-controls="import-paste-panel" aria-selected="true">粘贴正文</button>
        <button id="import-file-tab" class="import-tab" type="button" role="tab" tabindex="-1" data-action="select-import-tab" data-import-tab="file" aria-controls="import-file-panel" aria-selected="false">读取文件</button>
      </div>

      <section id="import-paste-panel" class="import-tab-panel span-2" role="tabpanel" aria-labelledby="import-paste-tab">
        <label for="import-content-input"><span>文章正文</span></label>
        <textarea id="import-content-input" rows="13" data-user-editable spellcheck="false" placeholder="支持 Markdown、HTML 或纯文本"></textarea>
      </section>

      <section id="import-file-panel" class="import-tab-panel span-2" role="tabpanel" aria-labelledby="import-file-tab" hidden>
        <label class="import-file-picker" for="import-file-input">
          <strong>选择本地文章文件</strong>
          <span>支持 .md、.markdown、.html、.htm、.txt，最大 5 MiB</span>
        </label>
        <input id="import-file-input" class="visually-hidden" type="file" tabindex="-1" accept=".md,.markdown,.html,.htm,.txt" aria-describedby="import-file-note import-file-status">
        <button class="secondary import-file-trigger" type="button" data-action="choose-import-file">浏览本机文件</button>
        <p id="import-file-note" class="field-note">文件只通过 FileReader 在当前浏览器中读取，原始文件不会上传。</p>
        <output id="import-file-status" class="import-file-status" aria-live="polite">尚未选择文件</output>
      </section>

      <div id="import-dialog-feedback" class="dialog-feedback span-2" role="status" aria-live="assertive"></div>
      <div class="dialog-actions">
        <button class="secondary" type="button" data-action="cancel-import">取消</button>
        <button class="primary" type="button" data-action="submit-import">导入并打开</button>
      </div>
    </div>
  </dialog>

  <dialog id="platform-publish-dialog" class="platform-publish-dialog" aria-labelledby="platform-publish-dialog-title" aria-describedby="platform-publish-dialog-description">
    <div class="dialog-head">
      <div>
        <strong id="platform-publish-dialog-title">确认平台操作</strong>
        <span id="platform-publish-dialog-description">请核对文章、平台和发布模式后再执行</span>
      </div>
      <button class="icon-btn" type="button" data-action="cancel-single-publish" aria-label="关闭平台发布确认对话框" title="关闭">×</button>
    </div>
    <div class="single-publish-summary">
      <dl>
        <div><dt>文章</dt><dd id="single-publish-article">-</dd></div>
        <div><dt>平台</dt><dd id="single-publish-platform">-</dd></div>
        <div><dt>模式</dt><dd id="single-publish-mode">-</dd></div>
      </dl>
      <div id="single-publish-feedback" class="dialog-feedback" role="status" aria-live="assertive"></div>
    </div>
    <div class="dialog-actions single-publish-actions">
      <button class="secondary" type="button" data-action="cancel-single-publish">取消</button>
      <button class="primary" type="button" data-action="confirm-single-publish">确认执行</button>
    </div>
  </dialog>

  <script src="/app.js?v=20260830-dynamic-content-center"></script>
</body>
</html>
